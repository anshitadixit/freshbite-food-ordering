<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FreshBite - My Account</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🍕 FreshBite
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="menu.html">Menu</a>
            </li>

            <li>
                <a href="restaurants.html">Restaurants</a>
            </li>

            <li>
                <a href="cart.html">
                    🛒 Cart
                    <span id="cart-count">0</span>
                </a>
            </li>

            <li>
                <a href="orders.html">My Orders</a>
            </li>

        </ul>

    </nav>


    <main>

        <section class="about">

            <h1>My Account 👤</h1>

            <div
                id="account-container"
                class="cart-summary">

                <h2>Profile</h2>

                <p id="account-name">
                    Guest User
                </p>

                <p id="account-email">
                    Please login to view your account.
                </p>

                <br>

                <a
                    href="login.html"
                    class="btn">
                    Login
                </a>

            </div>


            <!-- SAVED ADDRESS -->

            <div class="cart-summary">

                <h2>📍 Saved Addresses</h2>

                <div id="saved-addresses">

                    <p>
                        No saved addresses.
                    </p>

                </div>

                <button
                    class="checkout-btn"
                    onclick="addAddress()">

                    + Add Address

                </button>

            </div>


            <!-- WISHLIST -->

            <div class="cart-summary">

                <h2>❤️ My Wishlist</h2>

                <div
                    id="wishlist-container">

                    <p>
                        Your wishlist is empty.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 FreshBite. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

    <script>

        if (typeof updateCartCount === "function") {
            updateCartCount();
        }

        if (typeof displayAccount === "function") {
            displayAccount();
        }

    </script>

</body>

</html>
