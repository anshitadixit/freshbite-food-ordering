<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FreshBite - Contact Us</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🍕 FreshBite
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="menu.html">Menu</a>
            </li>

            <li>
                <a href="restaurants.html">Restaurants</a>
            </li>

            <li>
                <a href="cart.html">🛒 Cart</a>
            </li>

            <li>
                <a href="account.html">Account</a>
            </li>

        </ul>

    </nav>


    <main>

        <section class="contact">

            <h1>Contact Us 📞</h1>

            <p>
                Have a question? We'd love to hear from you.
            </p>


            <div class="cart-summary">

                <p>📍 FreshBite Food Services</p>

                <p>📞 +91 98765 43210</p>

                <p>📧 support@freshbite.com</p>

                <p>🕐 Monday - Saturday: 10 AM - 8 PM</p>

            </div>


            <div class="checkout-form">

                <h2>Send Us a Message</h2>

                <form
                    onsubmit="submitContactForm(event)">

                    <label>
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="contact-name"
                        required>


                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="contact-email"
                        required>


                    <label>
                        Message
                    </label>

                    <textarea
                        id="contact-message"
                        rows="5"
                        required>
                    </textarea>


                    <button
                        type="submit"
                        class="place-order-btn">

                        Send Message

                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 FreshBite. All rights reserved.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
