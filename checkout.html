<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshBite - Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVIGATION ================= -->

    <nav class="navbar">

        <div class="logo">
            🍕 FreshBite
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html#menu">Menu</a>
            </li>

            <li>
                <a href="cart.html">🛒 Cart</a>
            </li>

        </ul>

    </nav>


    <!-- ================= CHECKOUT ================= -->

    <section class="checkout-section">

        <h1>Checkout 🛍️</h1>

        <div class="checkout-container">


            <!-- ================= DELIVERY FORM ================= -->

            <div class="checkout-form">

                <h2>Delivery Details</h2>

                <form
                    id="checkout-form"
                    onsubmit="placeOrder(event)"
                >

                    <!-- NAME -->

                    <label for="customer-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="Enter your full name"
                        required
                    >


                    <!-- PHONE -->

                    <label for="customer-phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="Enter 10-digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >


                    <!-- ADDRESS -->

                    <label for="customer-address">
                        Delivery Address
                    </label>

                    <textarea
                        id="customer-address"
                        rows="4"
                        placeholder="House no., street, city, state, PIN code..."
                        required
                    ></textarea>


                    <!-- DELIVERY TIME -->

                    <label for="delivery-time">
                        Delivery Time
                    </label>

                    <select
                        id="delivery-time"
                        required
                    >

                        <option value="">
                            Select delivery time
                        </option>

                        <option value="As soon as possible (25-35 min)">
                            As soon as possible (25-35 min)
                        </option>

                        <option value="Within 1 hour">
                            Within 1 hour
                        </option>

                        <option value="Schedule for later">
                            Schedule for later
                        </option>

                    </select>


                    <!-- ================= PAYMENT ================= -->

                    <h2>Payment Method</h2>

                    <div class="payment-options">

                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="Cash on Delivery"
                                required
                            >

                            💵 Cash on Delivery

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="UPI"
                            >

                            📱 UPI

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="Card"
                            >

                            💳 Credit / Debit Card

                        </label>

                    </div>


                    <!-- ================= PLACE ORDER ================= -->

                    <button
                        type="submit"
                        class="place-order-btn"
                    >
                        Place Order 🍕
                    </button>

                </form>

            </div>


            <!-- ================= ORDER SUMMARY ================= -->

            <div class="checkout-summary">

                <h2>Order Summary</h2>


                <!-- Cart Items -->

                <div id="checkout-items">

                    <!-- JavaScript will display cart items here -->

                </div>


                <hr>


                <!-- SUBTOTAL -->

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ₹<span id="checkout-subtotal">0</span>
                    </span>

                </div>


                <!-- DELIVERY FEE -->

                <div class="summary-row">

                    <span>
                        Delivery Fee
                    </span>

                    <span>
                        ₹40
                    </span>

                </div>


                <hr>


                <!-- TOTAL -->

                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹<span id="checkout-total">0</span>
                    </span>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            © 2026 FreshBite. All Rights Reserved.
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="script.js"></script>

</body>

</html>
