<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🍕 FreshBite
        </div>

        <ul class="nav-links">

            <li>

            </li>

            <li>

            <li>

            <li>

            </li>

            <li>
                <a href="login.html">Login</a>

        </ul>

    <!-- MENU -->

    <main>

        <section class="featured">

            <h1>Our Menu 🍽️</h1>

            <p>
                Explore delicious food from FreshBite's collection.
            </p>


            <!-- FILTERS -->

            <div class="filter-buttons">

                </button>

                <button onclick="filterMenu('Pizza')">
                    🍕 Pizza
                </button>

                <button onclick="filterMenu('Burgers')">
                    🍔 Burgers
                </button>

                </button>

                <button onclick="filterMenu('Dessert')">

                </button>

                    🥗 Veg
                </button>

                <button onclick="filterMenu('Non-Veg')">

                </button>

            <div
                class="food-container"
                id="menu-food-container">

        </p>

    <script src="script.js"></script>

    <script>

        if (typeof updateCartCount === "function") {
            updateCartCount();
        }

        if (typeof displayMenu === "function") {
            displayMenu();
        }
